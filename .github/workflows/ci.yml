name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Host half runs inside the DSH desktop runtime, whose Node floor is
        # declared in package.json -> engines.node.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  artifacts:
    name: committed artifacts match the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `index.js` and `client.js` are committed on purpose: a `link:` install
      # does not run a build, so the tarball and the checkout must already
      # contain the real artifacts. That only stays honest if a stale pair can
      # never be pushed, which is what this job enforces.
      - name: Rebuild and fail on drift
        run: |
          pnpm build
          if ! git diff --exit-code -- index.js client.js; then
            echo "::error::index.js / client.js are stale. Run 'pnpm build' and commit the result."
            exit 1
          fi

  package:
    name: packaged files
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install needed: `npm pack` only reads `files` and the manifest.
      - name: Every entry point declared in package.json exists
        run: |
          node -e '
            const { existsSync } = require("node:fs");
            const pkg = require("./package.json");
            const required = [".", "./client", "./package.json"];
            for (const key of required) {
              const target = pkg.exports?.[key];
              if (typeof target !== "string") throw new Error(`exports["${key}"] is missing`);
              if (!existsSync(target)) throw new Error(`exports["${key}"] -> ${target} does not exist`);
            }
            for (const entry of pkg.files) {
              if (entry.includes("*")) continue;
              if (!existsSync(entry)) throw new Error(`files entry ${entry} does not exist`);
            }
            console.log("manifest and files list agree");
          '

      - name: npm pack
        run: |
          npm pack --dry-run
          npm pack
          tar -tzf dsh-orbis-*.tgz | sort
